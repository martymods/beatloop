<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Beatloop Media — Hip-Hop News</title>
  <meta name="description" content="Beatloop Media curates hip-hop headlines with AI summaries and watermarked visuals." />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f1220;
      --muted: #6e7280;
      --brand: #7c5cff;
      --edge: #e9ecf5;
      --media-bg: #fdfdfb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--media-bg);
      color: var(--ink);
      font-family: "Work Sans", sans-serif;
    }

    a {
      color: inherit;
    }

    .media-shell {
      padding: 2rem clamp(1rem, 4vw, 3rem);
      max-width: 1280px;
      margin: 0 auto;
    }

    .media-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.9rem;
      border: 2px solid #fadc00;
      border-radius: 999px;
      background: #fff9c4;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }

    h1 {
      font-family: "Space Mono", monospace;
      font-size: clamp(2.5rem, 4vw, 3.5rem);
      margin: 0 0 0.5rem 0;
    }

    .muted {
      color: var(--muted);
      margin: 0 0 1rem 0;
    }

    .back-link {
      color: var(--ink);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }

    .back-link:hover,
    .back-link:focus {
      border-color: currentColor;
      outline: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      position: relative;
      overflow: hidden;
    }

    .card h2 {
      font-family: "Space Mono", monospace;
      font-size: 1.4rem;
      margin: 0;
    }

    .card h2 a {
      text-decoration: none;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .card-source {
      font-weight: 700;
    }

    .card-img img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--edge);
      object-fit: cover;
    }

    .card-excerpt {
      color: var(--muted);
      min-height: 2.5rem;
      margin: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.65rem 1rem;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover:not(:disabled),
    .btn:focus-visible:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(15, 18, 32, 0.15);
      outline: none;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .summary-box {
      margin-top: 0.75rem;
      border-top: 1px solid var(--edge);
      padding-top: 0.75rem;
      animation: fadeIn 0.3s ease;
    }

    .summary-box p {
      margin: 0;
      line-height: 1.5;
    }

    .summary-box img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid var(--edge);
      margin-top: 0.5rem;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 720px) {
      .media-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .back-link {
        margin-top: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="media-shell">
    <header class="media-header">
      <div>
        <span class="badge">Beatloop Media</span>
        <h1>Hip-Hop News, Reimagined.</h1>
        <p class="muted">We remix hip-hop headlines with AI summaries, watermark our visuals, and invite the community to react in real time.</p>
      </div>
      <a class="back-link" href="/">&larr; Back to Studio</a>
    </header>
    <div id="status" class="muted">Loading hip-hop news…</div>
    <div id="newsList" class="grid"></div>
  </div>
  <script>
    async function getNews() {
      const res = await fetch('/api/media/hiphop-news');
      if (!res.ok) throw new Error('Failed to load feed');
      return res.json();
    }

    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'card';

      const heading = document.createElement('h2');
      const link = document.createElement('a');
      link.href = item.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = item.title || 'Untitled';
      heading.appendChild(link);
      card.appendChild(heading);

      const meta = document.createElement('div');
      meta.className = 'card-meta';
      const source = document.createElement('span');
      source.className = 'card-source';
      try {
        source.textContent = (new URL(item.url).hostname).replace(/^www\./, '');
      } catch (err) {
        source.textContent = item.source || 'Unknown';
      }
      meta.appendChild(source);
      if (item.publishedAt) {
        const published = new Date(item.publishedAt);
        const timestamp = document.createElement('span');
        if (!isNaN(published.getTime())) {
          timestamp.textContent = published.toLocaleString();
          meta.appendChild(timestamp);
        }
      }
      card.appendChild(meta);

      if (item.image) {
        const wrapper = document.createElement('div');
        wrapper.className = 'card-img';
        const img = document.createElement('img');
        img.src = item.image;
        img.alt = item.title || 'Article image';
        wrapper.appendChild(img);
        card.appendChild(wrapper);
      }

      const excerpt = document.createElement('p');
      excerpt.className = 'card-excerpt';
      excerpt.textContent = item.excerpt || '';
      card.appendChild(excerpt);

      const button = document.createElement('button');
      button.className = 'btn';
      button.textContent = 'AI Summary + Watermark';
      button.addEventListener('click', async () => {
        button.disabled = true;
        const originalText = button.textContent;
        button.textContent = 'Working…';
        try {
          const response = await fetch('/api/media/summarize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              url: item.url,
              title: item.title,
              image: item.image,
              excerpt: item.excerpt
            })
          });
          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || 'Unable to summarize');
          }
          const summaryBox = document.createElement('div');
          summaryBox.className = 'summary-box';
          summaryBox.innerHTML = payload.summary
            ? `<p><strong>Our summary:</strong> ${payload.summary}</p>`
            : '<p><em>No summary (OpenAI key not set).</em></p>';
          if (payload.image) {
            const summarizedImg = document.createElement('img');
            summarizedImg.src = payload.image;
            summarizedImg.alt = `${item.title || 'Article'} – watermarked`;
            summaryBox.appendChild(summarizedImg);
          }
          card.appendChild(summaryBox);
        } catch (error) {
          alert(error.message || 'Something went wrong');
        } finally {
          button.disabled = false;
          button.textContent = originalText;
        }
      });
      card.appendChild(button);

      return card;
    }

    (async () => {
      try {
        const feed = await getNews();
        const list = document.getElementById('newsList');
        const status = document.getElementById('status');
        if (status) status.remove();
        const items = Array.isArray(feed.items) ? feed.items : [];
        items.forEach((item) => list.appendChild(createCard(item)));
        if (!items.length) {
          list.textContent = 'No hip-hop news found.';
        }
      } catch (error) {
        const status = document.getElementById('status');
        if (status) {
          status.textContent = 'Unable to load hip-hop feed.';
        }
      }
    })();
  </script>
</body>
</html>
