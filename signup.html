<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>beatloop — Sign Up</title>
  <meta name="description" content="Create your beatloop account to join the creator network, upload your profile and start collaborating." />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { font-family: Inter, ui-sans-serif, system-ui, -apple-system; }
    .glass { background: rgba(18, 18, 24, .55); backdrop-filter: blur(10px); }
  </style>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: { DEFAULT: '#7c3aed' } } } } }
  </script>
</head>
<body class="bg-[#0c0c12] text-white min-h-screen flex items-center justify-center">
  <div class="glass rounded-2xl p-8 ring-1 ring-white/10 w-full max-w-md">
    <h1 class="text-2xl font-extrabold mb-4">Create your beatloop account</h1>
    <form id="signupForm" class="space-y-4" novalidate>
      <div>
        <label for="name" class="block text-sm mb-1">Name</label>
        <input id="name" type="text" required class="w-full rounded-lg border border-white/15 bg-white/10 px-4 py-2 text-white placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="Your name" />
      </div>
      <div>
        <label for="email" class="block text-sm mb-1">Email</label>
        <input id="email" type="email" required class="w-full rounded-lg border border-white/15 bg-white/10 px-4 py-2 text-white placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="you@example.com" />
      </div>
      <div>
        <label for="password" class="block text-sm mb-1">Password</label>
        <input id="password" type="password" required class="w-full rounded-lg border border-white/15 bg-white/10 px-4 py-2 text-white placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="••••••••" />
      </div>
      <div>
        <label for="confirm" class="block text-sm mb-1">Confirm Password</label>
        <input id="confirm" type="password" class="w-full rounded-lg border border-white/15 bg-white/10 px-4 py-2 text-white placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="••••••••" />
      </div>
      <div>
        <label for="avatar" class="block text-sm mb-1">Avatar (optional)</label>
        <input id="avatar" type="file" accept="image/*" class="w-full text-xs text-white" />
      </div>
      <button type="submit" class="w-full rounded-lg bg-primary px-4 py-2 font-semibold mt-2">Sign Up</button>
    </form>
    <p class="mt-4 text-center text-sm text-white/70">Already have an account? <a href="login.html" class="text-primary hover:underline">Sign in</a></p>
    <p id="errorMsg" class="mt-3 text-sm text-red-500 hidden"></p>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const err  = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.add('hidden');

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (!name || !email || !password) {
        err.textContent = 'Please fill in all required fields.';
        err.classList.remove('hidden');
        return;
      }
      if (confirm && confirm !== password) {
        err.textContent = 'Passwords do not match.';
        err.classList.remove('hidden');
        return;
      }

      try {
        const r = await fetch(API_BASE + '/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type':'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Sign up failed');

        // Save JWT and user just like login.html does
        AUTH.set(data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        // (Optional avatar upload is skipped; your app already falls back to a default avatar.)

        // Continue to the app
        window.location.href = 'network.html';
      } catch (e) {
        err.textContent = e.message;
        err.classList.remove('hidden');
      }
    });
  </script>

  <!-- Global API configuration for the beatloop webapp (same block as login.html) -->
  <script>
    // Point this at your Render API URL after deploy:
    const API_BASE = localStorage.getItem('beatloop_api') || 'http://localhost:8080';
    function setApiBase(url){ localStorage.setItem('beatloop_api', url); }
    let AUTH = {
      token: localStorage.getItem('jwt') || '',
      set(t){ this.token = t; localStorage.setItem('jwt', t); },
      hdr(){ return this.token ? { 'Authorization': 'Bearer ' + this.token } : {}; }
    };
  </script>
</body>
</html>
