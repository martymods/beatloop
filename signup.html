<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>beatloop — Sign Up</title>
  <meta name="description" content="Create your beatloop account to join the creator network, upload your profile and start collaborating." />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { font-family: Inter, ui-sans-serif, system-ui, -apple-system; }
    .glass { background: rgba(18, 18, 24, .55); backdrop-filter: blur(10px); }
  </style>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: { DEFAULT: '#7c3aed' } } } } }
  </script>
</head>
<body class="bg-[#0c0c12] text-white min-h-screen flex items-center justify-center">
  <div class="glass rounded-2xl p-8 ring-1 ring-white/10 w-full max-w-md">
    <h1 class="text-2xl font-extrabold mb-4">Create your beatloop account</h1>
    <form id="signupForm" class="space-y-4">
      <div>
        <label for="name" class="block text-sm mb-1">Name</label>
        <input id="name" type="text" required class="w-full rounded-lg border border-white/15 bg-white/10 px-4 py-2 text-white placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="Your name" />
      </div>
      <div>
        <label for="email" class="block text-sm mb-1">Email</label>
        <input id="email" type="email" required class="w-full rounded-lg border border-white/15 bg-white/10 px-4 py-2 text-white placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="you@example.com" />
      </div>
      <div>
        <label for="password" class="block text-sm mb-1">Password</label>
        <input id="password" type="password" required class="w-full rounded-lg border border-white/15 bg-white/10 px-4 py-2 text-white placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="••••••••" />
      </div>
      <div>
        <label for="confirm" class="block text-sm mb-1">Confirm Password</label>
        <!-- Do not use the required attribute here; validation happens in JS to prevent browser errors -->
        <input id="confirm" type="password" class="w-full rounded-lg border border-white/15 bg-white/10 px-4 py-2 text-white placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-primary" placeholder="••••••••" />
      </div>
      <div>
        <label for="avatar" class="block text-sm mb-1">Avatar (optional)</label>
        <input id="avatar" type="file" accept="image/*" class="w-full text-xs text-white" />
      </div>
      <button type="submit" class="w-full rounded-lg bg-primary px-4 py-2 font-semibold mt-2">Sign Up</button>
    </form>
    <p class="mt-4 text-center text-sm text-white/70">Already have an account? <a href="login.html" class="text-primary hover:underline">Sign in</a></p>
    <p id="errorMsg" class="mt-3 text-sm text-red-500 hidden"></p>
  </div>
  <script>
    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader()
        reader.onload = () => resolve(reader.result)
        reader.onerror = () => reject(reader.error)
        reader.readAsDataURL(file)
      })
    }
    const form = document.getElementById('signupForm')
    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const name = document.getElementById('name').value.trim()
      const email = document.getElementById('email').value.trim().toLowerCase()
      const password = document.getElementById('password').value
      const confirm = document.getElementById('confirm').value
      const avatarFile = document.getElementById('avatar').files[0]
      const error = document.getElementById('errorMsg')
      // Hide previous error
      error.classList.add('hidden')
      // Note: we accept the password as entered without requiring a separate confirmation match check.
      // You can implement stricter validation in the future.
      let users = JSON.parse(localStorage.getItem('users') || '{}')
      if (users[email]) {
        error.textContent = 'An account with this email already exists'
        error.classList.remove('hidden')
        return
      }
      let avatarData = ''
      if (avatarFile) {
        try {
          avatarData = await readFileAsDataUrl(avatarFile)
        } catch (err) {}
      }
      // If no avatar uploaded, assign the default fallback avatar
      users[email] = { name, email, password, avatar: avatarData || '/img/avatar-default.svg' }
      localStorage.setItem('users', JSON.stringify(users))
      localStorage.setItem('current_user', email)
      // Redirect to feed
      window.location.href = 'network.html'
    })
  </script>


<script>
  const errEl = document.getElementById('errorMsg');

  async function nameTaken(name){
    try{
      const r = await fetch(API_BASE + '/api/users/exists?name=' + encodeURIComponent(name));
      if (!r.ok) return false;
      const j = await r.json();
      return !!(j.exists);
    }catch{ return false; }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl?.classList?.add('hidden');

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm')?.value || password;
    const avatarFile = document.getElementById('avatar')?.files?.[0];

    if (password !== confirm) {
      if (errEl){ errEl.textContent = 'Passwords do not match'; errEl.classList.remove('hidden'); }
      return;
    }

    try {
      if (await nameTaken(name)) throw new Error('That display name is already taken. Choose another.');

      const r = await fetch(API_BASE + '/api/auth/signup', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ name, email, password })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Sign up failed');
      AUTH.set(data.token);
      localStorage.setItem('user', JSON.stringify(data.user));

      // Optional: upload avatar if chosen
      if (avatarFile){
        const fd = new FormData(); fd.append('avatar', avatarFile);
        await fetch(API_BASE + '/api/users/avatar', { method:'POST', headers:{ ...AUTH.hdr() }, body: fd });
      }

      window.location.href = 'network.html';
    } catch (e) {
      if (errEl){ errEl.textContent = e.message; errEl.classList.remove('hidden'); }
      else alert(e.message);
    }
  });
</script>

</body>
</html>
