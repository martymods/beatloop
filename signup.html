<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>beatloop — Sign Up</title>
  <meta name="description" content="Create your beatloop account to join the creator network, upload your profile and start collaborating." />
  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="./styles/tailwind.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --surface: rgba(18, 18, 24, 0.82);
      --surface-strong: rgba(18, 18, 24, 0.95);
      --primary: #7c3aed;
      --primary-soft: rgba(124, 58, 237, 0.65);
      --text: #f5f3ff;
      --text-muted: rgba(245, 243, 255, 0.65);
      --danger: #ff4d6d;
    }

    html,
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0c0c12;
      color: var(--text);
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .bg-grid::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(124, 58, 237, 0.12) 0, transparent 0);
      background-size: 32px 32px;
      opacity: 0.6;
      pointer-events: none;
    }

    .c-checkbox {
      display: none;
    }

    .c-form__progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      width: 0;
      background: linear-gradient(90deg, rgba(124, 58, 237, 0.2), var(--primary));
      transition: width 0.35s ease;
      z-index: 0;
    }

    .c-formContainer {
      position: relative;
      z-index: 1;
      width: 200px;
      height: 70px;
      display: flex;
      justify-content: center;
    }

    .c-welcome {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      text-align: center;
      padding: 2rem;
      background: var(--surface-strong);
      border-radius: 1.25rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }

    .c-welcome h2 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .c-welcome p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .c-form {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--surface);
      border-radius: 1.25rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      transition: width 0.3s ease, height 0.3s ease;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .c-form__toggle {
      width: 100%;
      height: 100%;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.3s ease, opacity 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: transparent;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .c-form__toggleIcon {
      display: inline-block;
      position: relative;
      width: 18px;
      height: 20px;
    }

    .c-form__toggleIcon::before,
    .c-form__toggleIcon::after {
      content: "";
      position: absolute;
      background: var(--text-muted);
      transition: transform 0.3s ease;
    }

    .c-form__toggleIcon::before {
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .c-form__toggleIcon::after {
      bottom: 0;
      left: 0;
      width: 100%;
      height: 8px;
      border-radius: 9px 9px 0 0;
    }

    .c-form__group {
      position: absolute;
      inset: 0;
      padding: 26px 30px 32px;
      box-sizing: border-box;
      visibility: hidden;
      opacity: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 1.5rem;
      transition: opacity 0.28s ease 0.25s, visibility 0s linear 0.25s;
    }

    .c-form__label {
      position: relative;
      width: calc(100% - 48px);
      min-height: 82px;
      display: flex;
      align-items: flex-end;
      cursor: text;
    }

    .c-form__input {
      font-size: 1.1rem;
      width: 100%;
      border: 0;
      outline: none;
      padding: 0 0 0.35rem;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      letter-spacing: 0.01em;
      transition: color 0.25s ease;
      caret-color: var(--primary);
    }

    .c-form__input::placeholder {
      color: transparent;
    }

    .c-form__input:focus,
    .c-form__input:not(:placeholder-shown) {
      ~ .c-form__groupLabel {
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        top: -0.35rem;
        transform: translateY(0);
        color: var(--text-muted);
      }

      ~ .c-form__border,
      ~ .c-form__next {
        transition: 0.3s ease;
      }

      ~ .c-form__border {
        width: 100%;
      }
    }

    .c-form__input:focus {
      cursor: initial;
    }

    .c-form__groupLabel {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-muted);
      pointer-events: none;
      transition: 0.25s ease;
    }

    .c-form__border {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 3px;
      background: var(--primary);
      border-radius: 3px;
      transition: width 0.9s ease 0.35s;
    }

    .c-form__next {
      position: absolute;
      right: -48px;
      bottom: 0;
      height: 60px;
      width: 48px;
      color: var(--text-muted);
      cursor: pointer;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.25s ease;
    }

    .c-form__nextIcon {
      position: relative;
      width: 22px;
      height: 3px;
      border-radius: 999px;
      background: currentColor;
    }

    .c-form__nextIcon::before,
    .c-form__nextIcon::after {
      content: "";
      position: absolute;
      right: -1.5px;
      width: 15px;
      height: 3px;
      background: inherit;
    }

    .c-form__nextIcon::before {
      bottom: -1.5px;
      transform-origin: top right;
      transform: rotate(45deg);
    }

    .c-form__nextIcon::after {
      top: -1.5px;
      transform-origin: bottom right;
      transform: rotate(-45deg);
    }

    .c-form__input:not(:placeholder-shown):invalid ~ .c-form__border,
    .c-form__input:not(:placeholder-shown):invalid ~ .c-form__next {
      color: var(--danger);
      background: none;
    }

    .c-form__input:required:valid ~ .c-form__next {
      pointer-events: initial;
      color: var(--primary);
    }

    .c-form__input:required:valid ~ .c-form__border {
      width: 100%;
    }

    .c-form__next.is-ready {
      color: var(--primary);
    }

    .c-form__group--final {
      justify-content: space-between;
      padding-bottom: 36px;
    }

    .c-form__finalFields {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .c-form__label--wide {
      width: 100%;
    }

    .c-form__fileInput {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px dashed rgba(245, 243, 255, 0.24);
      border-radius: 0.85rem;
      background: rgba(124, 58, 237, 0.08);
      color: var(--text-muted);
      font-size: 0.95rem;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .c-form__fileInput:hover,
    .c-form__fileInput:focus {
      border-color: var(--primary);
      background: rgba(124, 58, 237, 0.14);
    }

    .c-form__fileName {
      font-size: 0.8rem;
      color: var(--text-muted);
      min-height: 1rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .c-form__submit {
      border: 0;
      border-radius: 0.95rem;
      padding: 0.95rem 1rem;
      background: linear-gradient(135deg, var(--primary), rgba(124, 58, 237, 0.75));
      color: #fff;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 16px 35px rgba(124, 58, 237, 0.35);
    }

    .c-form__submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    .c-form__submit:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(124, 58, 237, 0.4);
    }

    .c-form__error {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2.75rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--danger);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .c-form__error.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .c-altLink {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .c-altLink a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .c-altLink a:hover {
      text-decoration: underline;
    }

    /* States */
    #start:checked ~ .c-form__progress {
      width: calc(100vw / 4);
    }

    #progress2:checked ~ .c-form__progress {
      width: calc(100vw / 4 * 2);
    }

    #progress3:checked ~ .c-form__progress {
      width: calc(100vw / 4 * 3);
    }

    #progress4:checked ~ .c-form__progress,
    #finish:checked ~ .c-form__progress {
      width: 100vw;
    }

    #start:checked ~ .c-formContainer .c-form {
      width: min(440px, 90vw);
      height: 340px;
    }

    #start:checked ~ .c-formContainer .c-form__toggle {
      visibility: hidden;
      opacity: 0;
      transform: scale(0.78);
    }

    #start:checked ~ .c-formContainer .c-form .c-form__group:nth-child(1) {
      visibility: visible;
      opacity: 1;
      transition-delay: 0s;
    }

    #start:checked ~ .c-formContainer .c-form .c-form__group:nth-child(1) .c-form__border {
      width: 100%;
    }

    #progress2:checked ~ .c-formContainer .c-form .c-form__group:nth-child(1),
    #progress3:checked ~ .c-formContainer .c-form .c-form__group:nth-child(1),
    #progress4:checked ~ .c-formContainer .c-form .c-form__group:nth-child(1) {
      visibility: hidden;
      opacity: 0;
      transition-delay: 0s;
    }

    #progress2:checked ~ .c-formContainer .c-form .c-form__group:nth-child(2) {
      visibility: visible;
      opacity: 1;
      transition-delay: 0s;
    }

    #progress2:checked ~ .c-formContainer .c-form .c-form__group:nth-child(2) .c-form__border {
      width: 100%;
    }

    #progress3:checked ~ .c-formContainer .c-form .c-form__group:nth-child(2),
    #progress4:checked ~ .c-formContainer .c-form .c-form__group:nth-child(2) {
      visibility: hidden;
      opacity: 0;
      transition-delay: 0s;
    }

    #progress3:checked ~ .c-formContainer .c-form .c-form__group:nth-child(3) {
      visibility: visible;
      opacity: 1;
      transition-delay: 0s;
    }

    #progress3:checked ~ .c-formContainer .c-form .c-form__group:nth-child(3) .c-form__border {
      width: 100%;
    }

    #progress4:checked ~ .c-formContainer .c-form .c-form__group:nth-child(3) {
      visibility: hidden;
      opacity: 0;
      transition-delay: 0s;
    }

    #progress4:checked ~ .c-formContainer .c-form .c-form__group:nth-child(4) {
      visibility: visible;
      opacity: 1;
      transition-delay: 0s;
    }

    #finish:checked ~ .c-formContainer .c-form {
      opacity: 0;
      transform: translateX(45%) scaleX(0.85);
      transition: opacity 0.25s ease 0.1s, transform 0.3s ease;
    }

    #finish:checked ~ .c-formContainer .c-welcome {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 520px) {
      body {
        padding: 1rem;
      }

      #start:checked ~ .c-formContainer .c-form {
        width: min(100%, 360px);
        height: 360px;
      }

      .c-form__group {
        padding: 24px 22px 32px;
      }

      .c-form__label {
        width: calc(100% - 44px);
      }
    }
  </style>
</head>
<body class="bg-grid">
  <input class="c-checkbox" type="checkbox" id="start">
  <input class="c-checkbox" type="checkbox" id="progress2">
  <input class="c-checkbox" type="checkbox" id="progress3">
  <input class="c-checkbox" type="checkbox" id="progress4">
  <input class="c-checkbox" type="checkbox" id="finish">
  <div class="c-form__progress"></div>

  <div class="c-formContainer">
    <div class="c-welcome">
      <h2>Welcome to beatloop!</h2>
      <p>We’re redirecting you to the network…</p>
    </div>
    <form id="signupForm" class="c-form" novalidate>
      <div class="c-form__group">
        <label class="c-form__label" for="name">
          <input id="name" type="text" class="c-form__input" placeholder=" " pattern="[^\s]+(\s+[^\s]+)*" required autocomplete="name">
          <label class="c-form__next" for="progress2" role="button">
            <span class="c-form__nextIcon"></span>
          </label>
          <span class="c-form__groupLabel">What should we call you?</span>
          <b class="c-form__border"></b>
        </label>
      </div>

      <div class="c-form__group">
        <label class="c-form__label" for="email">
          <input id="email" type="email" class="c-form__input" placeholder=" " pattern="[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{1,63}$" required autocomplete="email">
          <label class="c-form__next" for="progress3" role="button">
            <span class="c-form__nextIcon"></span>
          </label>
          <span class="c-form__groupLabel">What’s your email?</span>
          <b class="c-form__border"></b>
        </label>
      </div>

      <div class="c-form__group">
        <label class="c-form__label" for="password">
          <input id="password" type="password" class="c-form__input" placeholder=" " required autocomplete="new-password" minlength="6">
          <label class="c-form__next" for="progress4" role="button">
            <span class="c-form__nextIcon"></span>
          </label>
          <span class="c-form__groupLabel">Create a secure password.</span>
          <b class="c-form__border"></b>
        </label>
      </div>

      <div class="c-form__group c-form__group--final">
        <div class="c-form__finalFields">
          <label class="c-form__label c-form__label--wide" for="confirm">
            <input id="confirm" type="password" class="c-form__input" placeholder=" " autocomplete="new-password">
            <span class="c-form__groupLabel">Confirm your password.</span>
            <b class="c-form__border"></b>
          </label>
          <div>
            <label for="avatar" class="sr-only">Avatar (optional)</label>
            <input id="avatar" type="file" accept="image/*" class="c-form__fileInput">
            <div id="avatarName" class="c-form__fileName"></div>
          </div>
        </div>
        <button type="submit" class="c-form__submit">Create account</button>
      </div>

      <p id="errorMsg" class="c-form__error" role="alert"></p>
      <label class="c-form__toggle" for="start">Register <span class="c-form__toggleIcon"></span></label>
    </form>
  </div>

  <p class="c-altLink">Already have an account? <a href="login.html">Sign in</a></p>

  <!-- Global API + Auth helper -->
  <script>
    const API_BASE = localStorage.getItem('beatloop_api') || 'https://api.beatloop.co';
    function setApiBase(url){ localStorage.setItem('beatloop_api', url); }
    const AUTH = {
      token: localStorage.getItem('jwt') || '',
      set(t){ this.token = t; localStorage.setItem('jwt', t); },
      hdr(){ return this.token ? { 'Authorization': 'Bearer ' + this.token } : {}; }
    };
  </script>

  <script>
    const form = document.getElementById('signupForm');
    const err  = document.getElementById('errorMsg');
    const avatarInput = document.getElementById('avatar');
    const avatarName = document.getElementById('avatarName');
    const submitBtn = form.querySelector('.c-form__submit');

    avatarInput.addEventListener('change', () => {
      const file = avatarInput.files[0];
      avatarName.textContent = file ? file.name : '';
    });

    function unlockStep(stepCheckboxId) {
      const checkbox = document.getElementById(stepCheckboxId);
      if (checkbox && !checkbox.checked) {
        checkbox.checked = true;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.remove('is-visible');
      err.textContent = '';

      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      const avatarFile = avatarInput.files[0];

      if (!name || !email || !password) {
        err.textContent = 'Please fill in all required fields.';
        err.classList.add('is-visible');
        return;
      }

      if (confirm && confirm !== password) {
        err.textContent = 'Passwords do not match.';
        err.classList.add('is-visible');
        return;
      }

      submitBtn.disabled = true;

      try {
        const res = await fetch(API_BASE + '/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Sign up failed');

        AUTH.set(data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('current_user', data.user.email || email);

        if (avatarFile) {
          const fd = new FormData();
          fd.append('avatar', avatarFile);
          try {
            const avatarRes = await fetch(API_BASE + '/api/users/avatar', {
              method: 'POST',
              headers: { ...AUTH.hdr() },
              body: fd
            });
            if (avatarRes.ok) {
              const avatarData = await avatarRes.json().catch(() => ({}));
              if (avatarData?.avatarUrl) {
                try {
                  const stored = JSON.parse(localStorage.getItem('user') || 'null');
                  if (stored) {
                    stored.avatar = avatarData.avatarUrl;
                    localStorage.setItem('user', JSON.stringify(stored));
                  }
                } catch (_) {}
              }
            }
          } catch (_) {}
        }

        unlockStep('finish');
        setTimeout(() => { window.location.href = 'network.html'; }, 800);
      } catch (ex) {
        err.textContent = ex.message || 'Sign up failed. Please try again.';
        err.classList.add('is-visible');
      } finally {
        submitBtn.disabled = false;
      }
    });

    const requiredSteps = [
      { input: 'name', next: 'progress2' },
      { input: 'email', next: 'progress3' },
      { input: 'password', next: 'progress4' }
    ];

    requiredSteps.forEach(({ input, next }) => {
      const el = document.getElementById(input);
      const nextControl = document.querySelector(`label.c-form__next[for="${next}"]`);
      if (!el || !nextControl) return;

      el.addEventListener('input', () => {
        if (el.validity.valid) {
          nextControl.classList.add('is-ready');
        } else {
          nextControl.classList.remove('is-ready');
        }
      });

      nextControl.addEventListener('click', () => {
        if (!el.validity.valid) {
          el.reportValidity();
        }
      });
    });
  </script>
</body>
</html>
