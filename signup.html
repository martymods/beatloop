<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>beatloop — Sign Up</title>
  <meta name="description" content="Create your beatloop account to join the creator network, upload your profile and start collaborating." />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { font-family: Inter, ui-sans-serif, system-ui, -apple-system; }
    .glass { background: rgba(18, 18, 24, .55); backdrop-filter: blur(10px); }
  </style>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: { DEFAULT: '#7c3aed' } } } } }
  </script>
</head>
<body class="bg-[#0c0c12] text-white min-h-screen flex items-center justify-center">
  <div class="glass rounded-2xl p-8 ring-1 ring-white/10 w-full max-w-md">
    <h1 class="text-2xl font-extrabold mb-4">Create your beatloop account</h1>

    <form id="signupForm" class="space-y-4">
      <div>
        <label for="name" class="block text-sm mb-1">Name</label>
        <input id="name" type="text" required class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 outline-none focus:ring-2 focus:ring-primary" placeholder="Your name" />
      </div>
      <div>
        <label for="email" class="block text-sm mb-1">Email</label>
        <input id="email" type="email" required class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 outline-none focus:ring-2 focus:ring-primary" placeholder="you@example.com" />
      </div>
      <div>
        <label for="password" class="block text-sm mb-1">Password</label>
        <input id="password" type="password" required class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 outline-none focus:ring-2 focus:ring-primary" placeholder="••••••••" />
      </div>
      <div>
        <label for="confirm" class="block text-sm mb-1">Confirm Password</label>
        <input id="confirm" type="password" class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 outline-none focus:ring-2 focus:ring-primary" placeholder="••••••••" />
      </div>
      <div>
        <label for="avatar" class="block text-sm mb-1">Avatar (optional)</label>
        <input id="avatar" type="file" accept="image/*" class="w-full text-xs text-white" />
      </div>

      <button type="submit" class="w-full rounded-lg bg-primary px-4 py-2 font-semibold mt-2">Sign Up</button>
    </form>

    <p class="mt-4 text-center text-sm text-white/70">Already have an account? <a href="login.html" class="text-primary hover:underline">Sign in</a></p>
    <p id="errorMsg" class="mt-3 text-sm text-red-500 hidden"></p>
  </div>

  <!-- Global API + Auth helper -->
  <script>
    const API_BASE = localStorage.getItem('beatloop_api') || 'https://beatloop-api.onrender.com';
    function setApiBase(url){ localStorage.setItem('beatloop_api', url); }
    const AUTH = {
      token: localStorage.getItem('jwt') || '',
      set(t){ this.token = t; localStorage.setItem('jwt', t); },
      hdr(){ return this.token ? { 'Authorization': 'Bearer ' + this.token } : {}; }
    };
  </script>

  <script>
    const form = document.getElementById('signupForm');
    const err  = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.add('hidden');

      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      const avatarFile = document.getElementById('avatar').files[0];

      if (!name || !email || !password) {
        err.textContent = 'Please fill in all required fields.';
        err.classList.remove('hidden');
        return;
      }
      if (confirm && confirm !== password) {
        err.textContent = 'Passwords do not match.';
        err.classList.remove('hidden');
        return;
      }

      try {
        // Create the user in MongoDB (via Render API)
        const res = await fetch(API_BASE + '/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Sign up failed');

        AUTH.set(data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        // Optional avatar upload
        if (avatarFile) {
          const fd = new FormData();
          fd.append('avatar', avatarFile);
          try {
            const avatarRes = await fetch(API_BASE + '/api/users/avatar', {
              method: 'POST',
              headers: { ...AUTH.hdr() },
              body: fd
            });
                        if (avatarRes.ok) {
              const avatarData = await avatarRes.json().catch(() => ({}));
              if (avatarData?.avatarUrl) {
                try {
                  const stored = JSON.parse(localStorage.getItem('user') || 'null');
                  if (stored) {
                    stored.avatar = avatarData.avatarUrl;
                    localStorage.setItem('user', JSON.stringify(stored));
                  }
                } catch (_) {}
              }
            }
          } catch (_) {}
        }

        window.location.href = 'network.html';
      } catch (ex) {
        // Legacy local fallback (offline dev)
        try {
          let users = JSON.parse(localStorage.getItem('users') || '{}');
          if (users[email]) throw new Error('An account with this email already exists');
          users[email] = { name, email, password, avatar: '/img/avatar-default.svg' };
          localStorage.setItem('users', JSON.stringify(users));
          localStorage.setItem('current_user', email);
          window.location.href = 'network.html';
          return;
        } catch(_) {}
        err.textContent = ex.message || 'Sign up failed';
        err.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
