<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>beatloop — Creator Network</title>
  <meta name="description" content="Join the beatloop community to share tracks, comment on moments, and scroll through an endless feed of music and creators." />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { font-family: Inter, ui-sans-serif, system-ui, -apple-system; }
    .glass { background: rgba(18, 18, 24, .55); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-[#0c0c12] text-white min-h-screen flex flex-col">
  <!-- Header -->
  <header class="sticky top-0 z-50 border-b border-white/5 bg-[#0c0c12]/70 backdrop-blur">
    <div class="mx-auto max-w-7xl px-4 py-3 flex items-center gap-4">
      <a href="index.html" class="flex items-center gap-2 font-extrabold tracking-tight text-white">
        <span class="inline-flex size-8 items-center justify-center rounded-xl bg-primary/20 text-primary">BL</span>
        <span>beatloop</span>
      </a>
      <nav class="ml-auto hidden md:flex items-center gap-6 text-sm text-white/70">
        <a href="index.html#beats" class="hover:text-white">Beats</a>
        <a href="index.html#freestyle" class="hover:text-white">Freestyle</a>
        <a href="network.html" class="hover:text-white font-semibold text-white">Network</a>
        <a href="index.html#tools" class="hover:text-white">AI Tools</a>
        <a href="index.html#blog" class="hover:text-white">Blog</a>
      </nav>
      <button id="logoutBtn" class="ml-3 inline-flex items-center gap-2 rounded-xl bg-primary px-4 py-2 text-sm font-semibold shadow-glow hover:shadow-lg hover:shadow-primary/40 active:scale-[.99]">Log out</button>
    </div>
  </header>

  <!-- Feed -->
  <main id="feed" class="mx-auto max-w-3xl flex-1 w-full px-4 py-6"></main>
  <!-- Loading indicator -->
  <div id="loading" class="mx-auto max-w-3xl px-4 py-6 text-center text-white/60 hidden">
    Loading…
  </div>
  <!-- Scroll to top button -->
  <button id="scrollTop" class="hidden fixed bottom-20 right-5 z-40 p-3 rounded-full bg-primary shadow-glow text-white transition hover:shadow-lg" aria-label="Scroll to top">↑ Top</button>

  <script>
    // Tailwind primary colour configuration to match main site
    tailwind.config = { theme: { extend: { colors: { primary: { DEFAULT: '#7c3aed' } } } } }
  </script>
  <script>
    /*
      Simple feed implementation for the creator network.
      Uses localStorage to store users, sessions and comments.
      Each feed item displays a track with an audio element, a progress bar, and a list of comments.
      Comments are timestamped at the current playback position when submitted and stored per-track in localStorage.
    */

    // Data: Mirror the tracks used on the main page. You can extend this array with more items.
    const TRACKS = [
      { id: 'reggae-trap',   title: 'Reggae Trap',    artist: 'Slim Pattie',           bpm: 92, url: '/audio/reggae-trap.mp3',    cover: '/img/covers/reggae-trap.jpg' },
      { id: 'stack',         title: 'STACK',          artist: 'lilwoo',                bpm: 90, url: '/audio/stack.mp3',          cover: '/img/covers/stack.jpg' },
      { id: 'cleanup-woman', title: 'Da Cleanup Woman',  artist: 't-dub',               bpm: 95, url: '/audio/cleanup-woman.mp3', cover: '/img/covers/cleanup.jpg' },
      { id: 'we-go-make-it', title: 'We Go Make It',  artist: 'spanel-035',            bpm: 94, url: '/audio/we-go.mp3',         cover: '/img/covers/we-go.jpg' },
      { id: 'the-one',       title: 'The one',        artist: 'kloverfreshproduction', bpm: 89, url: '/audio/the-one.mp3',       cover: '/img/covers/the-one.jpg' },
      { id: 'it-is-what',    title: 'It is what it is',  artist: 'kloverfreshproduction', bpm: 90, url: '/audio/it-is.mp3',      cover: '/img/covers/it-is.jpg' }
    ]

    // State for feed loading
    let feedIndex = 0
    const BATCH_SIZE = 3
    const feedEl = document.getElementById('feed')
    const loadingEl = document.getElementById('loading')
    const scrollTopBtn = document.getElementById('scrollTop')

    // Current user data
    let currentUser = null

    // Helpers
    const fmt = (s) => {
      s = Math.floor(s || 0)
      const m = Math.floor(s / 60).toString()
      const sec = (s % 60).toString().padStart(2, '0')
      return `${m}:${sec}`
    }

    function loadCurrentUser() {
      const email = localStorage.getItem('current_user')
      if (!email) return null
      const users = JSON.parse(localStorage.getItem('users') || '{}')
      return users[email] || null
    }

    function ensureLoggedIn() {
      currentUser = loadCurrentUser()
      if (!currentUser) {
        // redirect to login
        window.location.href = 'login.html'
      }
    }

    // Comments storage
    function getComments(key) {
      return JSON.parse(localStorage.getItem('comments_' + key) || '[]')
    }

    function saveComment(key, comment) {
      const arr = getComments(key)
      arr.push(comment)
      localStorage.setItem('comments_' + key, JSON.stringify(arr))
    }

    function renderComments(trackId, container) {
      const comments = getComments(trackId)
      container.innerHTML = ''
      comments.forEach(c => {
        const row = document.createElement('div')
        row.className = 'flex items-start gap-2 mb-2'
        const avatar = document.createElement('img')
        avatar.src = c.avatar || '/img/covers/reggae-trap.jpg'
        avatar.alt = 'avatar'
        avatar.className = 'size-7 rounded-full'
        row.appendChild(avatar)
        const txtWrapper = document.createElement('div')
        const meta = document.createElement('p')
        meta.className = 'text-xs text-white/60'
        meta.textContent = fmt(c.time)
        const text = document.createElement('p')
        text.className = 'text-sm'
        text.textContent = c.text
        txtWrapper.appendChild(meta)
        txtWrapper.appendChild(text)
        row.appendChild(txtWrapper)
        container.appendChild(row)
      })
    }

    function createPost(track) {
      // Main card container
      const card = document.createElement('article')
      card.className = 'rounded-2xl border border-white/10 bg-white/5 ring-1 ring-white/10 p-4 my-4'
      // Header: user avatar/name/time (static for now)
      const header = document.createElement('div')
      header.className = 'flex items-center gap-3 mb-3'
      const avatar = document.createElement('img')
      avatar.src = currentUser.avatar || 'https://placekitten.com/50/50'
      avatar.alt = 'avatar'
      avatar.className = 'size-9 rounded-full'
      header.appendChild(avatar)
      const hInfo = document.createElement('div')
      const hName = document.createElement('p')
      hName.className = 'text-sm font-semibold'
      hName.textContent = currentUser.name || currentUser.email
      const hHandle = document.createElement('p')
      hHandle.className = 'text-xs text-white/60'
      hHandle.textContent = currentUser.email
      hInfo.appendChild(hName)
      hInfo.appendChild(hHandle)
      header.appendChild(hInfo)
      card.appendChild(header)
      // Track title/artist
      const title = document.createElement('h3')
      title.className = 'text-lg font-bold'
      title.textContent = track.title
      card.appendChild(title)
      const artist = document.createElement('p')
      artist.className = 'text-sm text-white/70'
      artist.textContent = `${track.artist} • ${track.bpm} BPM`
      card.appendChild(artist)
      // Audio element
      const audio = document.createElement('audio')
      audio.src = track.url
      audio.preload = 'metadata'
      audio.className = 'w-full mt-3'
      audio.controls = true
      card.appendChild(audio)
      // Progress bar container
      const barWrapper = document.createElement('div')
      barWrapper.className = 'relative mt-2 h-2 w-full bg-white/10 rounded overflow-hidden'
      const barProgress = document.createElement('div')
      barProgress.style.width = '0%'
      barProgress.className = 'absolute top-0 left-0 h-2 bg-primary rounded'
      barWrapper.appendChild(barProgress)
      const markers = document.createElement('div')
      markers.className = 'absolute top-0 left-0 h-2 w-full pointer-events-none'
      barWrapper.appendChild(markers)
      card.appendChild(barWrapper)
      // Comments list container
      const commentsList = document.createElement('div')
      commentsList.className = 'mt-3'
      card.appendChild(commentsList)
      // Comment form
      const formWrapper = document.createElement('div')
      formWrapper.className = 'flex items-center gap-2 mt-2'
      const input = document.createElement('input')
      input.type = 'text'
      input.placeholder = 'Add a comment…'
      input.className = 'flex-grow rounded-lg bg-white/10 border border-white/15 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary'
      const btn = document.createElement('button')
      btn.textContent = 'Send'
      btn.className = 'rounded-lg bg-primary px-4 py-2 text-sm font-semibold'
      formWrapper.appendChild(input)
      formWrapper.appendChild(btn)
      card.appendChild(formWrapper)
      // Insert into feed
      feedEl.appendChild(card)

      // Load existing comments
      function updateMarkers() {
        markers.innerHTML = ''
        const comments = getComments(track.id)
        comments.forEach(c => {
          const span = document.createElement('span')
          span.className = 'absolute top-0 h-2 w-1 rounded-full bg-white/80'
          // position based on percentage
          if (audio.duration) {
            const pct = (c.time / audio.duration) * 100
            span.style.left = pct + '%'
          }
          markers.appendChild(span)
        })
      }

      function render() {
        renderComments(track.id, commentsList)
        updateMarkers()
      }

      render()

      // Update progress bar during playback
      audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
          const pct = (audio.currentTime / audio.duration) * 100
          barProgress.style.width = pct + '%'
        }
      })

      // Loop the audio when it finishes
      audio.addEventListener('ended', () => {
        audio.currentTime = 0
        audio.play()
      })

      // Submit comment
      btn.addEventListener('click', () => {
        const text = input.value.trim()
        if (!text) return
        const time = audio.currentTime || 0
        saveComment(track.id, {
          text,
          time,
          user: currentUser.email,
          avatar: currentUser.avatar || ''
        })
        input.value = ''
        render()
      })

      return card
    }

    function loadMore() {
      if (feedIndex >= TRACKS.length) return
      loadingEl.classList.remove('hidden')
      setTimeout(() => {
        for (let i = 0; i < BATCH_SIZE && feedIndex < TRACKS.length; i++) {
          const track = TRACKS[feedIndex++] 
          createPost(track)
        }
        loadingEl.classList.add('hidden')
      }, 400)
    }

    window.addEventListener('scroll', () => {
      const nearBottom = window.innerHeight + window.pageYOffset >= document.body.offsetHeight - 200
      if (nearBottom) {
        loadMore()
      }
      if (window.pageYOffset > 300) {
        scrollTopBtn.classList.remove('hidden')
      } else {
        scrollTopBtn.classList.add('hidden')
      }
    })

    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' })
      // Optional refresh: when the user scrolls to top we reset the feed and load again
      feedIndex = 0
      // Remove existing posts
      feedEl.innerHTML = ''
      // Hide loading indicator and load fresh posts
      loadingEl.classList.add('hidden')
      loadMore()
    })

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('current_user')
      window.location.href = 'login.html'
    })

    // Initialize feed on load
    document.addEventListener('DOMContentLoaded', () => {
      ensureLoggedIn()
      loadMore()
    })
  </script>
</body>
</html>
