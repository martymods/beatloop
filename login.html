<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>beatloop — Sign In</title>
  <meta name="description" content="Sign in to beatloop to access the creator network, comment on tracks and share your own." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { font-family: Inter, ui-sans-serif, system-ui, -apple-system; }
    .glass { background: rgba(18, 18, 24, .55); backdrop-filter: blur(10px); }
  </style>
  <script>tailwind.config = { theme:{ extend:{ colors:{ primary:{ DEFAULT:'#7c3aed' }}}}}</script>
</head>
<body class="bg-[#0c0c12] text-white min-h-screen flex items-center justify-center">
  <div class="glass rounded-2xl p-8 ring-1 ring-white/10 w-full max-w-md">
    <h1 class="text-2xl font-extrabold mb-4">Sign in to beatloop</h1>

    <!-- onsubmit="return false" guarantees no page navigation even if JS fails early -->
    <form id="loginForm" class="space-y-4" onsubmit="return false" novalidate>
      <div>
        <label for="email" class="block text-sm mb-1">Email</label>
        <input id="email" type="email" autocomplete="username" required
               class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 outline-none focus:ring-2 focus:ring-primary"
               placeholder="you@example.com" />
      </div>
      <div>
        <label for="password" class="block text-sm mb-1">Password</label>
        <input id="password" type="password" autocomplete="current-password" required
               class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 outline-none focus:ring-2 focus:ring-primary"
               placeholder="••••••••" />
      </div>
      <button id="submitBtn" type="submit" class="w-full rounded-lg bg-primary px-4 py-2 font-semibold mt-2">Sign In</button>
    </form>

    <p class="mt-4 text-center text-sm text-white/70">
      Don't have an account? <a href="signup.html" class="text-primary hover:underline">Sign up</a>
    </p>
    <p id="errorMsg" class="mt-3 text-sm text-red-500 hidden"></p>
  </div>

  <!-- API + auth helpers -->
  <script>
    const API_BASE = localStorage.getItem('beatloop_api') || 'https://beatloop-api.onrender.com';
    const AUTH = {
      token: localStorage.getItem('jwt') || '',
      set(t){ this.token = t; localStorage.setItem('jwt', t); },
      hdr(){ return this.token ? { 'Authorization': 'Bearer ' + this.token } : {}; }
    };
  </script>

  <script>
    (function(){
      const form = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const err = document.getElementById('errorMsg');

      async function doLogin(e){
        e?.preventDefault?.();
        err.classList.add('hidden');
        submitBtn.disabled = true;

        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;

        try {
          const res = await fetch(API_BASE + '/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json().catch(()=>({}));
          if (!res.ok || !data?.token || !data?.user) {
            throw new Error(data?.error || 'Login failed');
          }

          // Save both new + legacy keys so Network page never bounces you back
          AUTH.set(data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          localStorage.setItem('current_user', data.user.email || email);

          location.href = 'network.html';
        } catch (ex) {
          // If API unreachable, allow legacy localStorage users
          try {
            const users = JSON.parse(localStorage.getItem('users') || '{}');
            if (users[email] && users[email].password === password) {
              localStorage.setItem('current_user', email);
              // keep 'user' shape for the network page header/avatar
              localStorage.setItem('user', JSON.stringify({ email, name: users[email].name || email, avatar: users[email].avatar || '/img/avatar-default.svg' }));
              location.href = 'network.html';
              return;
            }
          } catch(_) {}

          err.textContent = ex.message || 'Login failed';
          err.classList.remove('hidden');
        } finally {
          submitBtn.disabled = false;
        }
      }

      // submit button + Enter key both funnel here; form never navigates
      form.addEventListener('submit', doLogin);
      submitBtn.addEventListener('click', doLogin);
    })();
  </script>
</body>
</html>
