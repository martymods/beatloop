<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>beatloop — Sign In</title>
  <meta name="description" content="Sign in to beatloop to access the creator network, comment on tracks and share your own." />
  <meta name="beatloop-api-base" content="https://api.beatloop.co" />
  <link rel="stylesheet" href="./styles/tailwind.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html, body { font-family: Inter, ui-sans-serif, system-ui, -apple-system; }
      .glass { background: rgba(18, 18, 24, .55); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-[#0c0c12] text-white min-h-screen flex items-center justify-center">
  <div class="glass rounded-2xl p-8 ring-1 ring-white/10 w-full max-w-md">
    <h1 class="text-2xl font-extrabold mb-4">Sign in to beatloop</h1>

    <!-- onsubmit="return false" guarantees no page navigation even if JS fails early -->
    <form id="loginForm" class="space-y-4" onsubmit="return false" novalidate>
      <div>
        <label for="email" class="block text-sm mb-1">Email</label>
        <input id="email" type="email" autocomplete="username" required
               class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 outline-none focus:ring-2 focus:ring-primary"
               placeholder="you@example.com" />
      </div>
      <div>
        <label for="password" class="block text-sm mb-1">Password</label>
        <input id="password" type="password" autocomplete="current-password" required
               class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2 outline-none focus:ring-2 focus:ring-primary"
               placeholder="••••••••" />
      </div>
      <button id="submitBtn" type="submit" class="w-full rounded-lg bg-primary px-4 py-2 font-semibold mt-2">Sign In</button>
    </form>

    <p class="mt-4 text-center text-sm text-white/70">
      Don't have an account? <a href="signup.html" class="text-primary hover:underline">Sign up</a>
    </p>
    <p id="errorMsg" class="mt-3 text-sm text-red-500 hidden"></p>
  </div>

<!-- API + auth helpers -->
<script>
  const resolveApiBase = () => {
    const normalize = (value) => {
      if (typeof value !== 'string') return '';
      const trimmed = value.trim();
      if (!trimmed) return '';
      if (!/^https?:\/\//i.test(trimmed)) return '';
      return trimmed.replace(/\/+$/, '');
    };

    const candidates = [];
    try { candidates.push(localStorage.getItem('beatloop_api')); } catch {}
    try { candidates.push(document.querySelector('meta[name="beatloop-api-base"]')?.content); } catch {}
    candidates.push('https://api.beatloop.co');
    candidates.push('https://beatloop-api.onrender.com');
    candidates.push('http://localhost:10000');

    for (const candidate of candidates) {
      const normalized = normalize(candidate);
      if (normalized) {
        return normalized;
      }
    }

    return 'http://localhost:10000';
  };

  const API_BASE = resolveApiBase();
  try {
    if (API_BASE) {
      localStorage.setItem('beatloop_api', API_BASE);
    }
  } catch {}
  const AUTH = {
    token: localStorage.getItem('jwt') || '',
    set(t){ this.token = t; localStorage.setItem('jwt', t); },
    hdr(){ return this.token ? { 'Authorization': 'Bearer ' + this.token } : {}; }
  };

  function persistDirectoryUser(user, fallbackEmail) {
    if (!user) return;
    const emailRaw = typeof user.email === 'string' && user.email ? user.email : (typeof fallbackEmail === 'string' ? fallbackEmail : '');
    const emailKey = emailRaw.trim().toLowerCase();
    if (!emailKey) return;
    try {
      const existingRaw = localStorage.getItem('users');
      const directory = existingRaw ? JSON.parse(existingRaw) : {};
      const current = directory[emailKey] || {};
      directory[emailKey] = {
        ...current,
        id: user.id || current.id || null,
        name: user.name || current.name || emailKey,
        email: emailKey,
        avatar: user.avatar || current.avatar || '',
        tagUrl: user.tagUrl || current.tagUrl || '',
        joinedAt: user.joinedAt || current.joinedAt || Date.now()
      };
      localStorage.setItem('users', JSON.stringify(directory));
    } catch (err) {
      console.warn('Unable to cache user directory entry', err);
    }
  }
</script>

<script>
  (function(){
    const form = document.getElementById('loginForm');
    const btn  = document.getElementById('submitBtn');
    const err  = document.getElementById('errorMsg');

    // Never let the browser navigate the form by itself
    form.setAttribute('onsubmit', 'return false');

    async function doLogin(e){
      e?.preventDefault?.();
      err.classList.add('hidden');
      btn.disabled = true;

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      try {
        const r = await fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await r.json().catch(()=>({}));
        if (!r.ok || !data?.token || !data?.user) throw new Error(data?.error || 'Login failed');

        // Save ALL keys the app expects
        AUTH.set(data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('current_user', data.user.email || email); // legacy key some pages look for
        persistDirectoryUser(data.user, email);

        location.href = 'network.html';
      } catch (ex) {
        err.textContent = ex.message || 'Login failed. Please try again.';
        err.classList.remove('hidden');
      } finally {
        btn.disabled = false;
      }
    }

    form.addEventListener('submit', doLogin);
    btn.addEventListener('click', doLogin);
  })();
</script>
</body>
</html>
